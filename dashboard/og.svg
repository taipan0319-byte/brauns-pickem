    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F3D2B"/><stop offset="1" stop-color="#203731"/></linearGradient>
    <clipPath id="left"><path d="M0 0 H640 L560 630 H0 Z"/></clipPath>
