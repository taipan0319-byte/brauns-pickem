name: Refresh week and publish dashboard
on:
  workflow_dispatch:
    inputs:
      week:
        description: "Week number (blank = auto: first week with unplayed games)"
        required: false
        default: "auto"
  schedule:
    # GitHub delays or drops top-of-the-hour crons under load (Sunday 13:00 UTC was skipped twice).
    # Off-peak minutes, and two Sunday-morning attempts so at least one lands before the noon kickoffs.
    - cron: "23 11 * * 0"  # Sunday 6:23 am CT
    - cron: "41 13 * * 0"  # Sunday 8:41 am CT
    - cron: "17 20 * * 0"  # Sunday 3:17 pm CT (early-game finals)
    - cron: "37 19 * * 4"  # Thursday 2:37 pm CT
    - cron: "37 19 * * 1"  # Monday 2:37 pm CT
    - cron: "29 06 * * 2"  # Tuesday 1:29 am CT (Monday-night final, week rollover)
  push:
    branches: [main]
    paths: ["dashboard/**", "family.json", "standings.json", "pool_picks.csv"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install numpy
      - name: Run the v1.0 pipeline (Engine A, Engine B screen, dashboard build)
        if: github.event_name != 'push'
        run: |
          ARGS="--week ${{ github.event.inputs.week || 'auto' }}"
          if [ -f standings.json ]; then ARGS="$ARGS --standings standings.json"; fi
          python3 refresh.py $ARGS
      - name: Rebuild dashboard only (data files changed by hand)
        if: github.event_name == 'push'
        run: |
          ARGS="--week auto"
          if [ -f standings.json ]; then ARGS="$ARGS --standings standings.json"; fi
          python3 refresh.py $ARGS
      - name: Commit appended logs and rebuilt dashboard
        run: |
          git config user.name "pickem-bot"; git config user.email "pickem-bot@users.noreply.github.com"
          git add predictions_log.csv engine_b_log.csv dashboard/index.html dashboard/data.json
          git diff --cached --quiet || git commit -m "Refresh: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: dashboard }
      - id: deploy
        uses: actions/deploy-pages@v4
